# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://jpanther.github.io/congo/docs/getting-started/

baseURL = "[https://Linuxcu1.github.io/](https://Linuxcu1.github.io/)"

defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0
theme = 'congo'
 
 #Languange settings 
 [languages]
   [languages.en]
     label = "English"
     weight = 1
     contentDir = "content/en"
     title = "Jules"
     description = "I am not bound to any class stratum."

    [languages.tr]
      label = "Türkçe"
      weight = 2
      contentDir = "content/tr"
      title = "Jules"
      description = "Benim normal olmam , zaten bir anormal."


[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
[caches]
  [caches.images]
    dir = ':cacheDir/images'